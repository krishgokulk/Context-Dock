name: CI

# The merge gate for main (docs/master/00-ENGINEERING-OPERATING-MODEL.md §2.8): every PR must
# build and pass the whole offline suite before it can merge. scripts/test.sh builds the app
# and the test bundle, so one job covers both.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Use latest Xcode
        run: |
          ls /Applications | grep -i '^Xcode' || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install Metal toolchain
        # The project ships .metal shaders; the runner's Xcode doesn't bundle the
        # Metal toolchain by default ("cannot execute tool 'metal'").
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Test (Debug, ad-hoc signed)
        # No Apple Development certificate on the runner: sign ad-hoc so the test host can
        # launch on Apple Silicon, with no team and no provisioning.
        run: |
          ./scripts/test.sh \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER=

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: .build/XcodeTestDerivedData/last-test-run.log
          if-no-files-found: ignore
